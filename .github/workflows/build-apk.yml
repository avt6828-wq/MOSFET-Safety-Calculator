name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -o *.zip

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: MOSFET_Safety_Calculator_Android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MOSFET-Safety-Calculator-APK
          path: MOSFET_Safety_Calculator_Android/app/build/outputs/apk/debug/app-debug.apk
